    - id: graphics_text
      background: black
      widgets:
        - text: {color: yellow, size: 3, x: CENTER, y: 2, text: "Text Sizes (hold = back)"}
        - text:
            - {color: white, size: 0, x: 20, y: 40, text: "size 0  6x12"}
            - {color: white, size: 1, x: 20, y: 60, text: "size 1  8x16"}
            - {color: white, size: 2, x: 20, y: 85, text: "size 2  10x20"}
            - {color: white, size: 3, x: 20, y: 115, text: "size 3  12x24"}
            - {color: white, size: 5, x: 20, y: 150, text: "size 5  16x32"}
            - {color: white, size: 7, x: 20, y: 195, text: "size 7  24x48"}

    - id: graphics_numbers
      background: black
      widgets:
        - text: {color: yellow, size: 3, x: CENTER, y: 2, text: "Numbers (hold = back)"}
        - number:
            - {x: 100, y: 50, value: 7, digits: 4, size: 3, color: green, leading_zeros: zero}
            - {x: 100, y: 90, value: 7, digits: 4, size: 3, color: green, leading_zeros: space}
            - {x: 100, y: 130, value: -3.14159, digits: 2, decimals: 3, size: 3, color: green}
            - {x: 100, y: 170, value: 123456789, digits: 9, size: 3, color: green, signed: false}

    # =========================================================================================
    # Codes Demo Menu
    # =========================================================================================
    - id: codes
      background: white
      widgets:
        - menu:
            id: codes_menu_widget
            title: Codes Demo Menu
            title_color: black
            title_bg_color: "#E0E0E0"
            x: 0
            y: 0
            size: 4
            padding: 6
            bg_color: white
            item_color: black
            selector_type: arrow
            selector_color: blue
            wrap: true
            scrollbar: true
            scrollbar_color: grey
            items:
              - item:
                  text: QR Code
                  page: codes_qr
              - item:
                  text: Barcode
                  page: codes_barcode
              - item:
                  text: Small QR Light
                  page: codes_small_qr_light
              - item:
                  text: Back
                  back: true

    # -----------------------------------------------------------------------------------------
    # Codes Sub-Pages
    # -----------------------------------------------------------------------------------------
    - id: codes_qr
      background: white
      widgets:
        - text: {color: black, size: 3, x: CENTER, y: 2, text: "QR Code (hold = back)"}
        - qr_code: # 46*pixel_size square
            x: 148
            y: 50
            pixel_size: 4
            data: "https://esphome.io"

    - id: codes_barcode
      background: white
      widgets:
        - text: {color: black, size: 3, x: CENTER, y: 2, text: "Barcode (hold = back)"}
        - barcode: # 12 digits; display adds the check digit. 222x94 px, x/y snapped to even
            x: 128
            y: 80
            data: "978020137962"

    - id: codes_small_qr_light
      background: white
      widgets:
        - text: {color: black, size: 3, x: CENTER, y: 2, text: "Small QR Light (hold = back)"}
        - qr_code:
            x: 194
            y: 80
            pixel_size: 2
            data: !lambda 'return id(my_switch).state ? "LIGHT=ON" : "LIGHT=OFF";'
    # =========================================================================================
    # Settings (selector_type: arrow)
    # =========================================================================================
    - id: settings
      background: "#001830"
      widgets:
        - menu:
            title: Settings
            title_color: white
            title_bg_color: "#0040A0"
            size: 4
            bg_color: "#001830"
            item_color: white
            selector_type: arrow
            selector_color: yellow
            items:
              - text: !lambda 'return "Brightness: " + std::to_string(id(brightness_step)) + "%";'
                on_enter:
                  - lambda: |-
                      id(brightness_step) = id(brightness_step) <= 25 ? 100 : id(brightness_step) - 25;
                  - dwin.brightness:
                      brightness: !lambda return id(brightness_step);
              - text: Sleep now (knob wakes)
                on_enter:
                  - dwin.sleep:
              - text: Force redraw
                on_enter:
                  - dwin.page.redraw:
              - text: Go to dashboard
                on_enter:
                  - dwin.page.home:
              - text: Back
                back: true

    # =========================================================================================
    # Tools (selector_type: highlight) - low-level commands
    # =========================================================================================
    - id: tools
      background: black
      widgets:
        - menu:
            id: tools_menu
            title: Tools
            size: 3
            x: 0
            y: 0
            height: 200 # explicit height: leaves room for the status line below
            bg_color: black
            item_color: white
            selector_type: highlight
            selector_color: yellow
            selected_text_color: black
            items:
              - text: Write+read SRAM
                on_enter:
                  - dwin.memory.write:
                      type: sram
                      address: 0x0010
                      data: [0x12, 0x34, 0x56]
                  - dwin.memory.read: # result arrives in on_memory_read
                      type: sram
                      address: 0x0010
                      length: 3
                  - dwin.text.set: {id: tools_status, text: "SRAM written + read, see log"}
              - text: Write Flash (user data)
                on_enter:
                  - dwin.memory.write: # flash: 100k write cycles, use sparingly
                      type: flash
                      address: 0
                      data: "T5UIC1"
                  - dwin.text.set: {id: tools_status, text: "Flash write sent"}
              - text: Send via extended UART
                on_enter:
                  - dwin.extuart.send:
                      data: "hello from ESPHome\r\n"
                  - dwin.text.set: {id: tools_status, text: "Sent on ext UART"}
              - text: Scroll status area left
                on_enter:
                  - dwin.move_area:
                      direction: left
                      distance: 40
                      ring: true # rotate instead of pan
                      x1: 0
                      y1: 210
                      x2: 479
                      y2: 271
              - text: Raw handshake (cmd 0x00)
                on_enter:
                  - dwin.raw_send:
                      command: 0x00
                  - dwin.text.set: {id: tools_status, text: "Handshake sent"}
              - text: Select item 0
                on_enter:
                  - dwin.menu.select: {id: tools_menu, index: 0}
              - text: Back
                back: true
        - rectangle: {x: 0, y: 205, height: 2, color: grey, fill: true} # separator (no width = to right edge)
        - text:
            id: tools_status
            color: "#80FF80"
            size: 2
            x: 6
            y: 240
            text: "Ready"

# ---------------------------------------------------------------------------------------------
# Not shown above (need JPEG / ICO files on the SD card). Reference only:
#
#   pages: - id: x
#            background_image: 0           # full-screen JPEG slot 0-15, cached in virtual area 0
#
#   - image:                               # copy a region of a stored JPEG (or of the page image)
#       picture: 3                         # omit to use the current page's background image
#       source_x: 0
#       source_y: 0
#       width: 64
#       height: 64
#       x: 100
#       y: 100
#       transparent: false                 # true = black pixels are skipped
#       restore_background: false
#       strong_filter: false
#
#   - icon:                                # icons from an icon library (.ICO slot 0-15)
#       library: 8
#       icon: !lambda 'return id(my_switch).state ? 1 : 0;'    # or icons: [0, 1, 2]
#       icon_width: 28
#       icon_height: 45
#       x: 10
#       y: 10
#
#   - animation:                           # runs autonomously while the page is shown
#       group: 0
#       library: 9
#       start_icon: 0
#       end_icon: 9
#       delay: 100ms                       # multiple of 10 ms
#       x: 10
#       y: 10
#
#   - sram_icon:                           # JPEG icon whose bytes you wrote into SRAM
#       address: 0
#       x: 10
#       y: 10
#
#   actions: dwin.sram_to_picture: {picture: 5}   (stores SRAM contents as picture slot 5, ~2 s)
#            dwin.animation.start / dwin.animation.stop: {group: 0}
# ---------------------------------------------------------------------------------------------