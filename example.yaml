# =============================================================================================
# DWIN T5UIC1 (Ender-3 V2 LCD, 480x272) - feature tour
#
# Everything here works without images on the SD card. Left out because they need JPEG/ICO
# files in /DWIN_SET on the card (see the README): `image`, `icon`, `sram_icon`, `animation`,
# page `background_image`, and the dwin.animation.* actions. Their schemas are documented at
# the bottom of this file.
# =============================================================================================
esphome:
  name: dwin-panel

# ---- HARDWARE-BEGIN ----
esp32:
  board: esp32dev
  framework:
    type: esp-idf

uart:
  id: dwin_uart
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 115200 # must match T5UIC1.CFG (0x0044 = 115200)

binary_sensor:
  - platform: gpio
    id: dwin_button
    pin: {number: GPIO14, mode: {input: true, pullup: true}, inverted: true}
    filters:
      - delayed_on: 10ms

output:
  - platform: gpio # use `ledc` here instead for a passive buzzer that needs a tone
    id: dwin_buzzer
    pin: GPIO27
# ---- HARDWARE-END ----

logger:

external_components:
  source: 
      type: git
      url: https://github.com/jake5253/dwin_t5uic1_esphome
      ref: main

# ---------------------------------------------------------------------------------------------
# Some data to display (stand-ins for your real sensors / entities)
# ---------------------------------------------------------------------------------------------
globals:
  - id: target_temp
    type: float
    initial_value: "21.0"
  - id: brightness_step
    type: int
    initial_value: "100"
  - id: alert_visible
    type: bool
    initial_value: "false"

switch:
  - platform: template
    id: my_switch
    name: My Light Switch
    optimistic: true

sensor:
  # ---- HARDWARE2-BEGIN ----
  - platform: rotary_encoder
    id: dwin_knob
    pin_a: {number: GPIO25, mode: {input: true, pullup: true}}
    pin_b: {number: GPIO26, mode: {input: true, pullup: true}}
    resolution: 2 # Ender knobs give 4 pulses per detent
  # ---- HARDWARE2-END ----
  - platform: template
    id: room_temp
    name: Room Temperature
    lambda: return 19.0 + (millis() / 4000 % 10) * 0.5;
    update_interval: 2s
  - platform: template
    id: humidity
    name: Humidity
    lambda: return 30.0 + (millis() / 3000 % 40);
    update_interval: 2s

text_sensor:
  - platform: template
    id: status_text
    lambda: return {"System OK"};
    update_interval: 10s

# ---------------------------------------------------------------------------------------------
# The display
# ---------------------------------------------------------------------------------------------
dwin:
  id: my_dwin # optional when there is only one display
  uart_id: dwin_uart
  # --- inputs / outputs (all optional) ---
  encoder: dwin_knob # rotary_encoder sensor
  enter: dwin_button # binary_sensor
  buzzer: dwin_buzzer # any output (binary or float)
  click_beep: 15ms
  move_beep: 4ms
  encoder_invert: false # flip if the knob turns the wrong way
  long_press_time: 600ms
  long_press_back: true # long press = back, unless a page has on_long_click
  # --- panel ---
  width: 480 # physical panel size
  height: 272
  direction: 0 # 0 / 90 / 180 / 270 (or 0-3). 90/270 -> logical size 272x480
  cpu_frequency: 400 # must match T5UIC1.CFG (250 or 400 MHz) - scales command pacing
  # --- behaviour ---
  home_page: dashboard
  default_brightness: 100%
  sleep_delay: 5min # dim after 5 min idle on the home page
  sleep_brightness: 10% # 0% = backlight off
  sleep_on_any_page: false
  return_home_delay: 60s # sub-pages return home after 60 s idle
  update_interval: 250ms # how often dynamic widgets are polled
  handshake: true
  boot_timeout: 5s

  # --- display level events ---
  on_ready:
    - logger.log: DWIN display is ready
    - dwin.extuart.baud_rate: {baud_rate: 19200} # extended UART on the T5UIC1 board
  on_wake:
    - logger.log: Display woke up
  on_sleep:
    - logger.log: Display went to sleep
  on_page_change:
    - logger.log: Page changed
  on_memory_read: # reply to dwin.memory.read: type, address, data
    - lambda: |-
        ESP_LOGI("dwin", "memory read type=0x%02X addr=0x%04X, %d bytes, first=0x%02X", type, address,
                 (int) data.size(), data.empty() ? 0 : data[0]);
  on_memory_written: # flash write / SRAM->picture finished
    - logger.log: Memory write acknowledged
  on_extuart_data: # bytes received on the extra UART
    - lambda: ESP_LOGI("dwin", "extended UART received %d bytes", (int) x.size());

  pages:
    # =========================================================================================
    # Home / dashboard
    # =========================================================================================
    - id: dashboard
      background: "#101820" # name, 0xRRGGBB or "#RRGGBB"
      on_load:
        - logger.log: Dashboard shown
      on_unload:
        - logger.log: Leaving dashboard
      on_click: # click on a page without a focusable widget
        - dwin.page.show: main_menu
      on_clockwise: # turning the knob adjusts the target temperature
        - lambda: id(target_temp) += 0.5;
        - dwin.value.set:
            id: target_number
            value: !lambda return id(target_temp);
      on_anticlockwise:
        - lambda: id(target_temp) -= 0.5;
        - dwin.value.set:
            id: target_number
            value: !lambda return id(target_temp);
      on_long_click: # presence of this handler disables the default "long press = back"
        - lambda: id(alert_visible) = !id(alert_visible);
        - if:
            condition:
              lambda: return id(alert_visible);
            then:
              - dwin.widget.show: alert_bar
              - dwin.widget.show: alert_text
            else:
              - dwin.widget.hide: alert_text
              - dwin.widget.hide: alert_bar
      widgets:
        - rectangle: # title bar
            id: status_bar
            color: "#2060A0"
            fill: true
            x: 0
            y: 0
            height: 28 # no width -> fills to the right edge
        - text:
            - id: title
              color: white
              size: 4 # 14x28 font
              x: CENTER # centred on the screen
              y: 0
              text: Wall Panel
            - id: switch_label # lambda text is polled and redrawn on change
              color: white
              size: 3
              x: 16
              y: 44
              bg_color: "#101820" # lets short strings overwrite longer ones without flicker
              text: !lambda 'return id(my_switch).state ? "Light: On" : "Light: Off";'
            - color: "#80FF80"
              size: 2
              x: 16
              y: 80
              text_sensor: status_text # bind straight to a text_sensor
            - color: light_grey # Chinese is converted to GB2312 at compile time
              size: 4
              x: 300
              y: 44
              text: "迪文 DWIN"
        - number:
            - id: temp_number # bound to a sensor
              sensor: room_temp
              x: 16
              y: 120
              size: 6 # 20x40 font
              digits: 3
              decimals: 1
              color: orange
              bg_color: "#101820"
              leading_zeros: none # none | space | zero
            - id: target_number # driven by dwin.value.set
              value: 21.0
              x: 200
              y: 120
              size: 6
              digits: 3
              decimals: 1
              color: cyan
              bg_color: "#101820"
              signed: true
        - text:
            - {color: orange, size: 1, x: 16, y: 164, text: "Room temp"}
            - {color: cyan, size: 1, x: 200, y: 164, text: "Target (turn knob)"}
        - progress_bar:
            - id: humidity_bar # horizontal, sensor bound
              x: 16
              y: 190
              width: 220
              height: 16
              sensor: humidity
              min_value: 0
              max_value: 100
              color: "#30C0FF"
              bg_color: "#203040"
              border_color: white
            - id: target_bar # vertical, lambda bound
              x: 420
              y: 44
              width: 24
              height: 160
              vertical: true
              min_value: 10
              max_value: 30
              value: !lambda return id(target_temp);
              color: red
              bg_color: "#203040"
              border_color: white
        - text:
            - {color: white, size: 1, x: 16, y: 210, text: "Humidity"}
            - {color: grey, size: 0, x: 16, y: 252, text: "click: menu   turn: target   hold: alert"}
        - rectangle: # hidden until a long press
            id: alert_bar
            hidden: true
            color: red
            fill: true
            x: 0
            y: 228
            height: 24
        - text:
            id: alert_text
            hidden: true
            color: white
            size: 3
            x: CENTER
            y: 229
            text: "!! ALERT !!"

    # =========================================================================================
    # Main menu (selector_type: box)
    # =========================================================================================
    - id: main_menu
      background: black
      widgets:
        - menu:
            id: main_menu_widget
            title: Main Menu
            title_color: yellow
            title_bg_color: "#202020"
            x: 0
            y: 0 # no width/height -> fills the screen
            size: 4
            padding: 6
            bg_color: black
            item_color: white
            selector_type: box # box | arrow | highlight
            selector_color: red
            wrap: true # knob wraps around at the ends
            scrollbar: true
            scrollbar_color: grey
            items:
              - item:
                  text: Graphics demo
                  page: graphics # click navigates (pushes history)
              - item:
                  text: Codes demo
                  page: codes
              - item:
                  text: Settings
                  page: settings
              - item:
                  text: Tools
                  page: tools
              - item:
                  # text may be a lambda; it is re-polled while visible
                  text: !lambda 'return id(my_switch).state ? "Light: ON  (click)" : "Light: OFF (click)";'
                  on_select:
                    - dwin.beep: {duration: 5ms}
                  on_enter:
                    - switch.toggle: my_switch
              - item:
                  text: Back to dashboard
                  back: true

# =========================================================================================
    # Graphics Demo Menu
    # =========================================================================================
    - id: graphics
      background: black
      widgets:
        - menu:
            id: graphics_menu_widget
            title: Graphics Demo Menu
            title_color: yellow
            title_bg_color: "#202020"
            x: 0
            y: 0
            size: 4
            padding: 6
            bg_color: black
            item_color: white
            selector_type: arrow
            selector_color: red
            wrap: true
            scrollbar: true
            scrollbar_color: grey
            items:
              - item:
                  text: Rectangles
                  page: graphics_rectangles
              - item:
                  text: Lines
                  page: graphics_lines
              - item:
                  text: Points
                  page: graphics_points
              - item:
                  text: Bitmap
                  page: graphics_bitmap
              - item:
                  text: Bitmap Large
                  page: graphics_large_bitmap
              - item:
                  text: Text
                  page: graphics_text
              - item:
                  text: Numbers
                  page: graphics_numbers
              - item:
                  text: Back
                  back: true

    # -----------------------------------------------------------------------------------------
    # Graphics Sub-Pages
    # -----------------------------------------------------------------------------------------
    - id: graphics_rectangles
      background: black
      widgets:
        - text: {color: yellow, size: 3, x: CENTER, y: 2, text: "Rectangles (hold = back)"}
        - rectangle: {x: 10, y: 50, width: 120, height: 80, color: white} # frame
        - rectangle: {x: 150, y: 50, width: 120, height: 80, color: green, fill: true}
        - rectangle: {x: 290, y: 50, width: 120, height: 80, color: blue, fill: true, border_color: white}
        - rectangle: {x: 170, y: 70, width: 80, height: 40, color: white, xor: true} # XOR over the green box

    - id: graphics_lines
      background: black
      widgets:
        - text: {color: yellow, size: 3, x: CENTER, y: 2, text: "Lines (hold = back)"}
        - line:
            color: red
            points: # list form
              - [50, 150]
              - [120, 70]
              - [190, 150]
              - [260, 70]
        - line:
            color: cyan
            points: # dict form
              - {x: 50, y: 180}
              - {x: 400, y: 180}

    - id: graphics_points
      background: black
      widgets:
        - text: {color: yellow, size: 3, x: CENTER, y: 2, text: "Points (hold = back)"}
        - points: # individual dots, 3x3 px each
            color: yellow
            size: 3
            points: [[100, 100], [140, 120], [180, 140], [220, 160], [260, 100], [300, 120]]

    - id: graphics_bitmap
      background: black
      widgets:
        - text: {color: yellow, size: 3, x: CENTER, y: 2, text: "Bitmap (hold = back)"}
        - bitmap: # 8x8 two-colour bitmap, 1 byte per row, MSB = left
            x: 216
            y: 100
            width: 8
            color: red
            bg_color: black
            data: [0x66, 0xFF, 0xFF, 0xFF, 0x7E, 0x3C, 0x18, 0x00]

